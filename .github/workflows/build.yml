name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Disable Git autocrlf
        shell: powershell
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python

      - name: Fetch full built-in BTCUSD dataset for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/fetch_coinbase_btcusd.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Generate SHA256
        run: sha256sum build/BtcUsdReplay.exe > build/BtcUsdReplay.exe.sha256

      - name: Package portable directory
        shell: powershell
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $label = if ($env:REF_NAME -like 'v*') { $env:REF_NAME } else { 'latest' }
          $root = "portable/BtcUsdReplay"
          New-Item -ItemType Directory -Force -Path "$root/projects", "$root/data/sources" | Out-Null
          Set-Content -Path "$root/projects/.keep" -Value ""
          Set-Content -Path "$root/data/sources/.keep" -Value ""
          Copy-Item build/BtcUsdReplay.exe "$root/BtcUsdReplay.exe"
          $zip = "build/BtcUsdReplay-$label-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path portable/BtcUsdReplay -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + [IO.Path]::GetFileName($zip) | Set-Content "${zip}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: btcusd-replay-windows-x64
          path: |
            build/BtcUsdReplay.exe
            build/BtcUsdReplay.exe.sha256
            build/BtcUsdReplay-*-windows-x64.zip
            build/BtcUsdReplay-*-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Publish latest main build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'SilentlyContinue'
          gh release view latest --repo $env:REPOSITORY *> $null
          $latestExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $previousErrorActionPreference
          if ($latestExists) {
            gh release upload latest build/BtcUsdReplay.exe build/BtcUsdReplay.exe.sha256 build/BtcUsdReplay-latest-windows-x64.zip build/BtcUsdReplay-latest-windows-x64.zip.sha256 --clobber --repo $env:REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit latest --title "Latest build (main)" --notes "Automatically updated from main commit $env:COMMIT_SHA." --repo $env:REPOSITORY
          } else {
            gh release create latest build/BtcUsdReplay.exe build/BtcUsdReplay.exe.sha256 build/BtcUsdReplay-latest-windows-x64.zip build/BtcUsdReplay-latest-windows-x64.zip.sha256 --title "Latest build (main)" --notes "Automatically built from main commit $env:COMMIT_SHA." --repo $env:REPOSITORY --target $env:COMMIT_SHA
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $zip = "build/BtcUsdReplay-$env:TAG_NAME-windows-x64.zip"
          gh release create $env:TAG_NAME build/BtcUsdReplay.exe build/BtcUsdReplay.exe.sha256 $zip "${zip}.sha256" --title $env:TAG_NAME --generate-notes --repo $env:REPOSITORY
